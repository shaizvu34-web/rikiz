<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIKIZ — ניסוי hero מובייל</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="fonts/frank-ruhl-libre.css">
<style>
  :root {
    --ground:#E9EAE5; --surface:#F7F7F4; --surface-2:#DFE1DA;
    --ink:#16181A; --ink-soft:#6C716D; --hair:#C6C9C1; --mark:#B5473A;
    --body:system-ui,-apple-system,"Arial Hebrew","Segoe UI",sans-serif;
    --display:"Frank Ruhl Libre","New Peninim MT","Didot",Georgia,serif;
    --serif:"Didot","Bodoni 72",Georgia,"Times New Roman",serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --gut:clamp(20px,5vw,64px);
  }
  *{box-sizing:border-box;}
  body{margin:0;overflow-x:hidden;background:var(--ground);color:var(--ink);
    font-family:var(--body);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;}
  img{display:block;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  .label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);}

  header{position:sticky;inset-block-start:0;z-index:50;display:flex;align-items:center;
    justify-content:space-between;gap:20px;padding:16px var(--gut);
    background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--hair);}
  header .wordmark{font-family:var(--serif);font-size:27px;letter-spacing:.22em;direction:ltr;line-height:1;padding-inline-end:.22em;}
  header nav{display:flex;gap:22px;align-items:center;font-size:14px;color:var(--ink-soft);}
  header nav a.cta{color:var(--mark);border:1px solid var(--mark);padding:9px 16px;white-space:nowrap;}
  @media (max-width:780px){header nav a.plain{display:none;}}

  /* ── HERO (דסקטופ — כמו באתר) ── */
  .hero{
    --pad-top:clamp(36px,6vh,72px);
    position:relative;display:grid;grid-template-columns:1fr 1fr;align-items:stretch;gap:0;
    max-width:1680px;margin-inline:auto;min-height:min(88vh,780px);
    padding-block:var(--pad-top) 0;overflow:hidden;
  }
  .hero-copy{position:relative;z-index:2;align-self:center;justify-self:center;
    max-width:min(470px,88%);padding-inline:clamp(20px,3vw,44px);padding-block-end:clamp(24px,4vh,48px);}
  .hero-photo{margin:0;max-height:calc(100vh - var(--pad-top));overflow:hidden;
    -webkit-mask-image:linear-gradient(to right,#000 0%,#000 88%,rgba(0,0,0,0) 100%),linear-gradient(to bottom,rgba(0,0,0,0) 0%,#000 5%,#000 93%,rgba(0,0,0,0) 100%);
    mask-image:linear-gradient(to right,#000 0%,#000 88%,rgba(0,0,0,0) 100%),linear-gradient(to bottom,rgba(0,0,0,0) 0%,#000 5%,#000 93%,rgba(0,0,0,0) 100%);
    -webkit-mask-composite:source-in;mask-composite:intersect;}
  .hero-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;}
  h1{font-family:var(--display);font-size:clamp(40px,4.8vw,70px);font-weight:300;line-height:1.06;letter-spacing:-.005em;margin:16px 0 0;text-wrap:balance;}
  h1 i{font-style:normal;font-weight:500;}
  .hero p{max-width:38ch;margin:24px 0 0;font-size:18px;font-weight:300;color:var(--ink-soft);}
  .hero .actions{display:flex;gap:16px;align-items:center;margin-top:32px;flex-wrap:wrap;}
  .cta{display:inline-block;font-size:14px;letter-spacing:.02em;color:var(--mark);border:1px solid var(--mark);padding:11px 22px;transition:background .16s,color .16s;}
  .cta:hover{background:var(--mark);color:var(--surface);}
  .ghost{font-size:14.5px;color:var(--ink-soft);border-bottom:1px solid var(--hair);padding-bottom:3px;}

  /* ── HERO (מובייל — הניסוי: אותה שפה, מוערם, עם צילום הכפכף הלבן) ── */
  @media (max-width:1000px){
    .hero{
      display:flex;flex-direction:column;align-items:center;text-align:center;
      min-height:0;padding:20px 0 clamp(40px,7vh,64px);
      background:linear-gradient(to bottom,#E2E2E1 0%,#E2E2E1 46%,var(--ground) 100%);
    }
    .hero-photo{
      order:-1;
      width:100%;
      max-height:clamp(260px,46vh,440px);
      margin:0 auto clamp(14px,3vh,26px);
      /* מסכה למובייל — דהייה בתחתית ובצדדים בלבד */
      -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 80%,rgba(0,0,0,0) 100%),linear-gradient(to left,rgba(0,0,0,0) 0%,#000 8%,#000 92%,rgba(0,0,0,0) 100%);
      mask-image:linear-gradient(to bottom,#000 0%,#000 80%,rgba(0,0,0,0) 100%),linear-gradient(to left,rgba(0,0,0,0) 0%,#000 8%,#000 92%,rgba(0,0,0,0) 100%);
      -webkit-mask-composite:source-in;mask-composite:intersect;
    }
    .hero-photo img{object-position:50% 38%;}
    .hero-copy{max-width:94vw;padding-inline:16px;padding-block-end:0;}
    h1{font-size:clamp(34px,8.5vw,48px);}
    .hero p{margin:16px auto 0;font-size:16px;max-width:34ch;}
    .hero .actions{justify-content:center;margin-top:22px;gap:12px;}
  }

  section{padding:clamp(56px,9vw,110px) var(--gut);}
  .sec-head{border-top:1px solid var(--ink);padding-top:18px;max-width:1120px;margin-inline:auto;}
  .sec-head .label{display:block;}
  .sec-head h2{font-family:var(--display);font-size:clamp(27px,4vw,42px);font-weight:300;margin:10px 0 0;}
  .sec-head p{margin:16px 0 0;color:var(--ink-soft);font-weight:300;}
</style>
</head>
<body>

<header>
  <a href="#" class="wordmark">RIKIZ</a>
  <nav>
    <a href="#" class="plain">הקולקציה</a>
    <a href="#" class="plain">התהליך</a>
    <a class="cta" href="#">להזמנת עיצוב</a>
  </nav>
</header>

<main>
  <div class="hero">
    <div class="hero-copy">
      <span class="label">כפכפי הוואיאנס · עבודת יד</span>
      <h1>התכשיט הבא<br><i>לרגל</i> שלך.</h1>
      <p>כל זוג משובץ ביד, אבן אחר אבן — קריסטלים, פנינים ותליוני ים, על גוף הכפכף שאת בוחרת.</p>
      <div class="actions">
        <a class="cta" href="#">לראות את הקולקציה</a>
        <a class="ghost" href="#">איך זה נוצר</a>
      </div>
    </div>
    <figure class="hero-photo">
      <img src="images/d25.jpg" width="912" height="1216" alt="זוג כפכפי הוואיאנס לבנים משובצים פנינים ושיבוץ זהב">
    </figure>
  </div>

  <section>
    <div class="sec-head">
      <span class="label">הקולקציה</span>
      <h2>כל דגם, סיפור קטן</h2>
      <p>ככה נראה מה שמתחת ל-hero — כדי שתראה אם הכפתורים נשארים מעל הקיפול.</p>
    </div>
  </section>
</main>

</body>
</html>
